[tools]
# Pinned rather than "latest": the toolchain has to be the same on a laptop and
# in CI. uv and bun were missing entirely — they only worked locally because
# mise had them installed globally, so a fresh clone or CI had neither.
python = "3.14"
node = "26"
uv = "0.11"
bun = "1.3"

[tasks.backend_lint]
description = "Lint backend"
run = [
  "uv run mypy .",
  "uv run ruff check .",
]
dir = "{{cwd}}/backend"

[tasks.frontend_lint]
description = "Lint frontend"
# `bun run lint` is read-only (biome check). It used to end with `bun run format`,
# which is `biome check --write` — so `mise lint` reformatted the working tree and
# always passed. A check that fixes what it is checking cannot fail in CI.
run = [
  "bun run lint",
  "bun run typecheck",
]
dir = "{{cwd}}/frontend"

[tasks.lint]
description = "Lint application"
depends = ["backend_lint", "frontend_lint"]

[tasks.backend_format]
description = "format backend"
run = [
  "uv run ruff check . --fix",
  "uv run ruff format .",
]
dir = "{{cwd}}/backend"

[tasks.frontend_format]
description = "format frontend"
run = [
  "bun run format",
]
dir = "{{cwd}}/frontend"

[tasks.format]
description = "format application"
depends = ["backend_format", "frontend_format"]

[tasks.backend_test]
description = "test backend"
run = [
  "uv run pytest",
]
dir = "{{cwd}}/backend"

[tasks.frontend_test]
description = "test frontend"
run = [
  "bun run test",
]
dir = "{{cwd}}/frontend"

[tasks.test]
description = "test application"
depends = ["backend_test", "frontend_test"]

# --- Running the app -------------------------------------------------------
# `dev` serves the frontend from Vite on its own port (two origins, CORS applies).
# `start` serves the built SPA from FastAPI on a single origin — that is what
# `serve` then exposes on the tailnet. See docs/CONTEXT.md.

[tasks.dev_backend]
description = "API with autoreload"
run = "uv run uvicorn app.api:app --reload"
dir = "{{cwd}}/backend"

[tasks.dev_frontend]
description = "Vite dev server"
run = "bun dev"
dir = "{{cwd}}/frontend"

[tasks.dev]
description = "Run the app for development (API + Vite, two origins)"
depends = ["dev_backend", "dev_frontend"]

[tasks.build]
description = "Build the frontend for production"
run = "bun run build"
dir = "{{cwd}}/frontend"

[tasks.start]
description = "Serve the built SPA and the API from a single origin on :8000"
depends = ["build"]
# Binds to loopback on purpose: `tailscale serve` proxies from the tailnet to
# localhost, so the port never needs to be exposed on the local network.
run = "uv run uvicorn app.api:app --host 127.0.0.1 --port 8000"
dir = "{{cwd}}/backend"

[tasks.serve]
description = "Expose the running site on the tailnet over HTTPS"
run = [
  "tailscale serve --bg 8000",
  "tailscale serve status",
]

[tasks.unserve]
description = "Stop exposing the site on the tailnet"
run = "tailscale serve reset"

[tasks.scrape]
description = "Refresh screenings and TMDB metadata"
run = "uv run python scraper_entrypoint.py"
dir = "{{cwd}}/backend"
