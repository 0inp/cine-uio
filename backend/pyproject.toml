[project]
name = "cine-uio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "fastapi>=0.136.3",
  "fastapi-cors>=0.0.6",
  "playwright>=1.60.0",
  "pytest>=9.0.3",
  "python-dotenv>=1.2.2",
  "requests>=2.34.2",
  "sqlalchemy>=2.0.50",
  "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "ruff>=0.15.15",
]

[tool.fastapi]
entrypoint = "app.api:app"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
