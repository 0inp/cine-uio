repos:
  - repo: local
    hooks:
      # Backend: Linting + Typecheck
      - id: backend-lint
        name: backend-lint
        entry: mise run backend_lint
        language: system
        pass_filenames: false
        files: ^backend/
        
      # Backend: Formatting
      - id: backend-format
        name: backend-format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        files: ^backend/

      # Frontend: Linting + Typecheck
      - id: frontend-lint
        name: frontend-lint
        entry: mise run frontend_lint
        language: system
        pass_filenames: false
        files: ^frontend/
        
      # Frontend: Formatting
      - id: frontend-format
        name: frontend-format
        entry: bun run format --check
        language: system
        pass_filenames: false
        files: ^frontend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending
      - id: fix-encoding-pragma
        language_version: python3
